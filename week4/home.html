<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox2</title>
    <link rel="stylesheet" href="css/home.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <img src="images/positivus.jpg" alt="Positivus logo" class="logo">
            </div>

            <div class="menu-bar">
                <p>About us</p>
                <p>Services</p>
                <p>Use Cases</p>
                <p>Pricing</p>
                <p>Blog</p>
                <button class="button">Request a quote</button>


            </div>
            <div class="mobile-menu">
                <img src="images/menu.png" width="30px" alt="Mobile menu icon">
            </div>

        </div>
        <div class="middle">
            <div class="middle-content">
                <h1>Navigating the digital landscape for success</h1>
                <p>Our digital marketing agency helps businesses grow and succeed online through a range of services
                    including SEO, PPC, social media marketing, and content creation.</p>
                <button class="middle-button">Book a consultation</button>
            </div>
            <div class="mid-image">
                <img src="images/illustration.png" width="100%" alt="Megaphone illustration">
            </div>
        </div>
        <div class="brands">
            <div><img class="brand-logo" src="images/amazon.png" alt="Amazon"></div>
            <div><img class="brand-logo" src="images/dribble.png" alt="Dribbble"></div>
            <div><img class="brand-logo" src="images/hubspot.png" alt="HubSpot"></div>
            <div><img class="brand-logo" src="images/notion.png" alt="Notion"></div>
            <div><img class="brand-logo" src="images/netflix.png" alt="Netflix"></div>
            <div><img class="brand-logo" src="images/zoom.png" alt="Zoom"></div>
        </div>
    </div>
</body>

</html>
